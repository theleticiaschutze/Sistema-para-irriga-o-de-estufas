{% extends "base.html" %}
{% block content %}
<h2>Editar Dispositivo</h2>
<form method="post">
    {% csrf_token %}
    
    <!-- Campo oculto para enviar o 'type' no POST para a views.py -->
    <input type="hidden" name="type" value="{{ device_type }}">
    
    <div class="form-group">
        <label for="name">Nome do Dispositivo</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ device.name }}" required>
    </div>
    
    <div class="form-group">
        <label for="topic">Tópico MQTT</label>
        <input type="text" class="form-control" id="topic" name="topic" value="{{ device.topic }}" required>
    </div>

    {% if device_type == 'command' %}
    <div class="form-group mb-3">
        <label for="status_topic">Tópico MQTT de Status</label>
        <input type="text" class="form-control" id="status_topic" name="status_topic" value="{{ device.status_topic|default:'' }}" placeholder="Ex: topicIrrigacao_ifsc/8">        
    </div>
    {% endif %}
    

    {% if device_type == 'sensor' %}
    <div class="form-group" id="tipo-selection">
        <label for="tipo_sensor">Tipo de Sensor</label>
        <select class="form-control" id="tipo_sensor" name="tipo_sensor">
            <option value="Temperatura" {% if device.tipo_sensor == 'Temperatura' %}selected{% endif %}>Temperatura</option>
            <option value="Humidade" {% if device.tipo_sensor == 'Humidade' %}selected{% endif %}>Humidade</option>
        </select>
    </div>
    {% endif %}
    
    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
</form>
{% endblock %}
